# Memoria para Gradle (Loom descompila el juego y la necesita).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Versiones fijadas (2026-11-07). No se suben sin el OK de Limbers: cada subida puede romper Mixins y APIs.
# Comprobar en https://fabricmc.net/develop y en Modrinth.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4

# Fabric API y Kotlin (fabric_kotlin_version lleva dentro la versión de Kotlin: debe coincidir con kotlin_version)
fabric_api_version=0.165.2+26.3
fabric_kotlin_version=1.14.2+kotlin.2.4.21
kotlin_version=2.4.21
# La que trae fabric-language-kotlin 1.14.2 dentro (se usa la suya en el juego): no se sube por separado.
kotlinx_serialization_version=1.11.0

# Otras librerías
geckolib_version=5.5.7
junit_version=5.13.4
spark_version=1.10.187-fabric
lithium_version=mc26.3-0.26.3-fabric
sodium_version=mc26.3-0.9.3-beta.3-fabric

# Mod
version=0.0.1
group=dev.limbers.bastion
